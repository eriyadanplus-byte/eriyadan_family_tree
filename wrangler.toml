name = "eriyaden-legacy"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".vercel/output/static"

# Environment variables available to Workers at runtime
[vars]
NEXT_PUBLIC_SUPABASE_URL = "REPLACE_WITH_URL"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "REPLACE_WITH_KEY"
SUPABASE_SERVICE_ROLE_KEY = "REPLACE_WITH_KEY"
JWT_SECRET = "REPLACE_WITH_SECRET"
NODE_ENV = "production"